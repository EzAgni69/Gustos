name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The schema and its migrations must never drift apart: a column the code
      # uses but no migration creates only fails once it reaches production.
      - name: Check database migrations are up to date
        working-directory: packages/db-schema
        run: |
          pnpm exec drizzle-kit generate --config=drizzle.config.cloud.ts
          pnpm exec drizzle-kit generate --config=drizzle.config.local.ts
          git diff --exit-code -- drizzle || (echo "::error::Schema changed without a migration. Run pnpm db:generate and commit the result." && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (echo "::error::Uncommitted generated migration files." && exit 1)
